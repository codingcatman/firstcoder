<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Adam Banck — Portfolio</title>
  <meta name="description" content="Selected work across product design, UI design, and photography." />
  <link rel="stylesheet" href="assets/site.css" />
  <link rel="stylesheet" href="assets/fonts.css" />
  <style>
    .home-hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .home-main {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: clamp(24px, 5vh, 48px);
      padding: 60px 0;
    }
    .home-kicker {
      font-size: 0.75rem;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--ink-soft);
    }
    .categories {
      display: flex;
      flex-direction: column;
      gap: clamp(4px, 1.2vh, 14px);
    }
    .categories a {
      font-family: var(--font-head);
      font-size: clamp(2.4rem, 8vw, 5.2rem);
      font-weight: 600;
      line-height: 1.1;
      letter-spacing: -0.01em;
      text-decoration: none;
      color: var(--ink);
      opacity: 0.9;
      display: inline-block;
      transition: opacity 0.3s ease, transform 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .categories a:hover { opacity: 1; transform: scale(1.03); }
  </style>
</head>
<body>
  <div class="home-hero wrap">
    <header class="topbar">
      <span>Adam Banck</span>
    </header>

    <main class="home-main">
      <p class="home-kicker serif">Selected Work</p>
      <nav class="categories" aria-label="Work categories">
        <a href="work/product-design/index.html">Product Design</a>
        <a href="work/ui-design/index.html">UI Design</a>
        <a href="work/photography/index.html">Photography</a>
      </nav>
    </main>
  </div>

  <footer>
    <div class="wrap foot-grid">
      <span class="meta">Adam Peter Ehrensvärd Banck &middot; 2026</span>
    </div>
  </footer>
</body>
</html>
