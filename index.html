<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grow the Cow 🐄</title>
  <style>
    :root {
      --sky: #bfe3ff;
      --grass: #7cc36b;
      --panel: #ffffff;
      --ink: #2c3e2f;
      --accent: #4a8c3f;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
      color: var(--ink);
      background: var(--sky);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 48px;
    }

    h1 {
      margin: 8px 0 4px;
      font-size: 2rem;
      text-shadow: 0 2px 0 rgba(255, 255, 255, 0.6);
    }

    .subtitle {
      margin: 0 0 20px;
      opacity: 0.85;
      font-size: 0.95rem;
    }

    .stage {
      width: min(680px, 100%);
      text-align: center;
    }

    .cow-yard {
      height: 420px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .cow-scene {
      width: 240px;
      height: 220px;
      perspective: 900px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: grab;
      touch-action: none;      /* let us handle drag on touch */
      user-select: none;
    }

    .cow-scene.dragging { cursor: grabbing; }
    .cow-scene.happy { animation: chew 0.4s ease; }

    @keyframes chew {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-14px); }
    }

    /* Rotating + scaling group that holds the whole 3D cow model. */
    .cow-cube {
      position: relative;
      width: 1px;
      height: 1px;
      transform-style: preserve-3d;
      transition: transform 0.2s ease;   /* smooths growth; disabled while dragging */
    }

    .cow-cube.grown {
      filter: drop-shadow(0 0 12px rgba(255, 214, 71, 0.85));
    }

    /* A cuboid part of the cow. Its faces are generated in JS. */
    .box {
      position: absolute;
      top: 50%;
      left: 50%;
      transform-style: preserve-3d;
    }

    /* A single face of a part. Size + placement transform set inline in JS. */
    .bf {
      position: absolute;
      top: 50%;
      left: 50%;
      background: var(--c, #fdfdfd);
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.05);
    }

    /* Simple directional shading so the model reads as solid 3D. */
    .bf.top    { filter: brightness(1.15); }
    .bf.bottom { filter: brightness(0.55); }
    .bf.right  { filter: brightness(0.9); }
    .bf.left   { filter: brightness(0.78); }

    /* Black-and-white cow spots on the body. */
    .box.body .bf {
      background-color: #fdfdfd;
      background-image:
        radial-gradient(circle at 24% 30%, #242424 0 17%, transparent 18%),
        radial-gradient(circle at 70% 58%, #242424 0 21%, transparent 22%),
        radial-gradient(circle at 46% 82%, #242424 0 11%, transparent 12%);
    }

    .box.head .bf,
    .box.leg .bf    { --c: #f4f4f4; }
    .box.tail .bf   { --c: #f0f0f0; }
    .box.snout .bf  { --c: #f3aebd; }
    .box.ear .bf    { --c: #f6d7de; }
    .box.horn .bf   { --c: #e9dcc3; }
    .box.hoof .bf,
    .box.eye .bf,
    .box.tailtip .bf { --c: #1c1c1c; }

    .hint {
      margin: 10px 0 0;
      font-size: 0.85rem;
      opacity: 0.7;
    }

    .progress-wrap {
      margin: 20px 0 4px;
      background: #e8ede8;
      border-radius: 999px;
      height: 18px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #8fd07a, var(--accent));
      border-radius: 999px;
      transition: width 0.4s ease;
    }

    .score {
      font-size: 1.05rem;
      font-weight: bold;
      margin-top: 8px;
    }

    .message {
      min-height: 1.4em;
      margin: 10px 0 4px;
      font-size: 0.95rem;
      color: var(--accent);
      font-weight: bold;
    }

    .foods {
      display: flex;
      gap: 28px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 14px;
    }

    /* Plain clickable emojis — no button chrome. */
    button.food {
      border: none;
      background: none;
      padding: 6px;
      font-size: 3rem;
      line-height: 1;
      cursor: pointer;
      transition: transform 0.12s ease, opacity 0.2s ease;
    }

    button.food:hover:not(:disabled) { transform: scale(1.2); }
    button.food:active:not(:disabled) { transform: scale(0.92); }
    button.food:disabled { opacity: 0.4; cursor: not-allowed; }

    .reset {
      margin-top: 18px;
      border: none;
      border-radius: 16px;
      padding: 14px 28px;
      font-size: 1.05rem;
      font-family: inherit;
      font-weight: bold;
      color: #fff;
      background: #3d6fb4;
      cursor: pointer;
      box-shadow: 0 5px 0 rgba(0, 0, 0, 0.18);
      transition: transform 0.1s ease;
    }

    .reset:hover { transform: translateY(-2px); }
    .reset:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0, 0, 0, 0.18); }
    .reset[hidden] { display: none; }
  </style>
</head>
<body>
  <h1>Grow the Cow 🐄</h1>
  <p class="subtitle">Feed the cow to help it grow. Reach 30 points to fully grow it!</p>

  <div class="stage">
    <div class="cow-yard">
      <div class="cow-scene" id="cowScene" title="Drag to rotate">
        <div class="cow-cube" id="cowCube"></div>
      </div>
    </div>
    <p class="hint">🖱️ Drag the cow to spin it and inspect all sides.</p>

    <div class="progress-wrap">
      <div class="progress-bar" id="progressBar"></div>
    </div>
    <div class="score" id="score">Growth: 0 / 30 points</div>

    <p class="message" id="message">Pick a food to start feeding!</p>

    <div class="foods" id="foods">
      <button class="food" data-food="grass" data-points="3"
              title="Grass · +3 points" aria-label="Feed grass, plus 3 points">🌿</button>
      <button class="food" data-food="soy" data-points="2"
              title="Soy · +2 points" aria-label="Feed soy, plus 2 points">🫘</button>
      <button class="food" data-food="flowers" data-points="1"
              title="Flowers · +1 point" aria-label="Feed flowers, plus 1 point">🌸</button>
    </div>

    <button class="reset" id="reset" hidden>Play again 🔄</button>
  </div>

  <script>
    (function () {
      "use strict";

      var MAX_POINTS = 30;
      var MIN_SCALE = 0.7;   // model scale when empty
      var MAX_SCALE = 1.7;   // model scale when fully grown

      var sceneEl = document.getElementById("cowScene");
      var cubeEl = document.getElementById("cowCube");
      var scoreEl = document.getElementById("score");
      var barEl = document.getElementById("progressBar");
      var messageEl = document.getElementById("message");
      var foodsEl = document.getElementById("foods");
      var resetEl = document.getElementById("reset");
      var foodButtons = Array.prototype.slice.call(
        foodsEl.querySelectorAll("button.food")
      );

      var points = 0;

      // Rotation state (degrees), starting at a 3/4 angle so the model
      // reads as 3D right away.
      var rotX = -14;
      var rotY = -34;
      var growthScale = MIN_SCALE;

      var FOOD_LABELS = {
        grass: "grass 🌿",
        soy: "soy 🫘",
        flowers: "flowers 🌸"
      };

      // --- Build the 3D cow model out of shaded cuboids ---

      // Create one cuboid ("part") of size w x h x d, positioned at
      // (x, y, z) with y pointing up. Faces are generated and shaded.
      function makeBox(w, h, d, opts) {
        opts = opts || {};
        var box = document.createElement("div");
        box.className = "box" + (opts.cls ? " " + opts.cls : "");
        box.style.transform =
          "translate3d(" + (opts.x || 0) + "px," +
          (-(opts.y || 0)) + "px," + (opts.z || 0) + "px)" +
          (opts.rx ? " rotateX(" + opts.rx + "deg)" : "") +
          (opts.ry ? " rotateY(" + opts.ry + "deg)" : "") +
          (opts.rz ? " rotateZ(" + opts.rz + "deg)" : "");

        var faces = [
          ["front",  w, h, "translateZ(" + (d / 2) + "px)"],
          ["back",   w, h, "rotateY(180deg) translateZ(" + (d / 2) + "px)"],
          ["right",  d, h, "rotateY(90deg) translateZ(" + (w / 2) + "px)"],
          ["left",   d, h, "rotateY(-90deg) translateZ(" + (w / 2) + "px)"],
          ["top",    w, d, "rotateX(90deg) translateZ(" + (h / 2) + "px)"],
          ["bottom", w, d, "rotateX(-90deg) translateZ(" + (h / 2) + "px)"]
        ];

        faces.forEach(function (f) {
          var el = document.createElement("div");
          el.className = "bf " + f[0];
          el.style.width = f[1] + "px";
          el.style.height = f[2] + "px";
          el.style.transform = "translate(-50%, -50%) " + f[3];
          box.appendChild(el);
        });

        return box;
      }

      function buildCow() {
        var parts = [
          // torso
          makeBox(110, 55, 62, { cls: "body", x: 0, y: 0, z: 0 }),
          // head + face details (cow faces toward +x)
          makeBox(46, 46, 46, { cls: "head",  x: 66, y: 10, z: 0 }),
          makeBox(26, 24, 34, { cls: "snout", x: 92, y: 2,  z: 0 }),
          makeBox(7,  9,  6,  { cls: "eye",   x: 88, y: 18, z: 14 }),
          makeBox(7,  9,  6,  { cls: "eye",   x: 88, y: 18, z: -14 }),
          makeBox(10, 16, 24, { cls: "ear",   x: 58, y: 24, z: 32, rz: 18 }),
          makeBox(10, 16, 24, { cls: "ear",   x: 58, y: 24, z: -32, rz: 18 }),
          makeBox(7,  16, 7,  { cls: "horn",  x: 56, y: 38, z: 12 }),
          makeBox(7,  16, 7,  { cls: "horn",  x: 56, y: 38, z: -12 }),
          // legs
          makeBox(18, 46, 18, { cls: "leg", x: 34,  y: -50, z: 20 }),
          makeBox(18, 46, 18, { cls: "leg", x: 34,  y: -50, z: -20 }),
          makeBox(18, 46, 18, { cls: "leg", x: -34, y: -50, z: 20 }),
          makeBox(18, 46, 18, { cls: "leg", x: -34, y: -50, z: -20 }),
          // hooves
          makeBox(19, 9, 19, { cls: "hoof", x: 34,  y: -74, z: 20 }),
          makeBox(19, 9, 19, { cls: "hoof", x: 34,  y: -74, z: -20 }),
          makeBox(19, 9, 19, { cls: "hoof", x: -34, y: -74, z: 20 }),
          makeBox(19, 9, 19, { cls: "hoof", x: -34, y: -74, z: -20 }),
          // tail
          makeBox(6, 46, 6, { cls: "tail",    x: -58, y: -6,  z: 0, rz: -14 }),
          makeBox(10, 13, 10, { cls: "tailtip", x: -64, y: -30, z: 0 })
        ];
        parts.forEach(function (p) { cubeEl.appendChild(p); });
      }

      function updateTransform() {
        cubeEl.style.transform =
          "rotateX(" + rotX + "deg) rotateY(" + rotY + "deg) " +
          "scale(" + growthScale + ")";
      }

      function render() {
        var clamped = Math.min(points, MAX_POINTS);
        var ratio = clamped / MAX_POINTS;

        // Grow the cow by scaling the whole 3D cube.
        growthScale = MIN_SCALE + (MAX_SCALE - MIN_SCALE) * ratio;
        updateTransform();

        // Progress bar + score text.
        barEl.style.width = (ratio * 100) + "%";
        scoreEl.textContent = "Growth: " + clamped + " / " + MAX_POINTS + " points";
      }

      function feed(food, foodPoints) {
        if (points >= MAX_POINTS) return;

        points += foodPoints;
        if (points > MAX_POINTS) points = MAX_POINTS;

        messageEl.textContent = "Yum! You fed " + FOOD_LABELS[food] +
          " (+" + foodPoints + ").";

        // Chew bounce on the scene (independent of the cube's rotation).
        sceneEl.classList.remove("happy");
        void sceneEl.offsetWidth; // restart animation
        sceneEl.classList.add("happy");

        render();

        if (points >= MAX_POINTS) finish();
      }

      function finish() {
        cubeEl.classList.add("grown");
        messageEl.textContent = "🎉 The cow is fully grown! Great job! " +
          "Drag it around to admire your work.";
        foodButtons.forEach(function (btn) { btn.disabled = true; });
        resetEl.hidden = false;
        resetEl.focus();
      }

      function reset() {
        points = 0;
        cubeEl.classList.remove("grown");
        messageEl.textContent = "Pick a food to start feeding!";
        foodButtons.forEach(function (btn) { btn.disabled = false; });
        resetEl.hidden = true;
        render();
      }

      // --- Drag to rotate (mouse + touch via Pointer Events) ---
      var dragging = false;
      var lastX = 0;
      var lastY = 0;

      sceneEl.addEventListener("pointerdown", function (e) {
        dragging = true;
        lastX = e.clientX;
        lastY = e.clientY;
        sceneEl.classList.add("dragging");
        cubeEl.style.transition = "none"; // 1:1 responsiveness while dragging
        if (sceneEl.setPointerCapture) {
          try { sceneEl.setPointerCapture(e.pointerId); } catch (_) {}
        }
        e.preventDefault();
      });

      sceneEl.addEventListener("pointermove", function (e) {
        if (!dragging) return;
        var dx = e.clientX - lastX;
        var dy = e.clientY - lastY;
        lastX = e.clientX;
        lastY = e.clientY;

        rotY += dx * 0.6;
        rotX -= dy * 0.6;
        updateTransform();
      });

      function endDrag(e) {
        if (!dragging) return;
        dragging = false;
        sceneEl.classList.remove("dragging");
        cubeEl.style.transition = ""; // restore smoothing for growth
        if (sceneEl.releasePointerCapture && e.pointerId != null) {
          try { sceneEl.releasePointerCapture(e.pointerId); } catch (_) {}
        }
      }

      sceneEl.addEventListener("pointerup", endDrag);
      sceneEl.addEventListener("pointercancel", endDrag);

      foodButtons.forEach(function (btn) {
        btn.addEventListener("click", function () {
          feed(btn.getAttribute("data-food"),
               parseInt(btn.getAttribute("data-points"), 10));
        });
      });

      resetEl.addEventListener("click", reset);

      // Initial state.
      buildCow();
      render();
    })();
  </script>
</body>
</html>
