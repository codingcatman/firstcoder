<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grow the Cow 🐄</title>
  <style>
    :root {
      --sky: #bfe3ff;
      --grass: #7cc36b;
      --panel: #ffffff;
      --ink: #2c3e2f;
      --accent: #4a8c3f;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
      color: var(--ink);
      background: linear-gradient(180deg, var(--sky) 0%, var(--sky) 55%, var(--grass) 55%, var(--grass) 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 48px;
    }

    h1 {
      margin: 8px 0 4px;
      font-size: 2rem;
      text-shadow: 0 2px 0 rgba(255, 255, 255, 0.6);
    }

    .subtitle {
      margin: 0 0 20px;
      opacity: 0.85;
      font-size: 0.95rem;
    }

    .stage {
      width: min(680px, 100%);
      background: var(--panel);
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.15);
      text-align: center;
    }

    .cow-yard {
      height: 420px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #eaf7ff 0%, #eaf7ff 60%, #d7f0cd 60%, #d7f0cd 100%);
      border-radius: 18px;
      overflow: hidden;
      position: relative;
    }

    .cow-scene {
      width: 240px;
      height: 220px;
      perspective: 900px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: grab;
      touch-action: none;      /* let us handle drag on touch */
      user-select: none;
    }

    .cow-scene.dragging { cursor: grabbing; }
    .cow-scene.happy { animation: chew 0.4s ease; }

    @keyframes chew {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-14px); }
    }

    .cow-cube {
      position: relative;
      width: 140px;
      height: 110px;
      transform-style: preserve-3d;
      transition: transform 0.2s ease;   /* smooths growth; disabled while dragging */
    }

    .face {
      position: absolute;
      top: 50%;
      left: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      border-radius: 8px;
    }

    /* Front / back show the cow; the four rims are cowhide. */
    .face.front,
    .face.back { width: 140px; height: 110px; font-size: 92px; }
    .face.right,
    .face.left { width: 80px; height: 110px; }
    .face.top,
    .face.bottom { width: 140px; height: 80px; }

    .face.front  { transform: translate(-50%, -50%) translateZ(40px); }
    .face.back   { transform: translate(-50%, -50%) rotateY(180deg) translateZ(40px); }
    .face.right  { transform: translate(-50%, -50%) rotateY(90deg) translateZ(70px); }
    .face.left   { transform: translate(-50%, -50%) rotateY(-90deg) translateZ(70px); }
    .face.top    { transform: translate(-50%, -50%) rotateX(90deg) translateZ(55px); }
    .face.bottom { transform: translate(-50%, -50%) rotateX(-90deg) translateZ(55px); }

    .face.skin {
      background:
        radial-gradient(circle at 28% 35%, #3a2a20 0 12%, transparent 13%),
        radial-gradient(circle at 72% 62%, #3a2a20 0 16%, transparent 17%),
        radial-gradient(circle at 50% 85%, #3a2a20 0 9%, transparent 10%),
        #fbf7f2;
      box-shadow: inset 0 0 0 2px rgba(0, 0, 0, 0.06);
    }

    .hint {
      margin: 10px 0 0;
      font-size: 0.85rem;
      opacity: 0.7;
    }

    .progress-wrap {
      margin: 20px 0 4px;
      background: #e8ede8;
      border-radius: 999px;
      height: 18px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #8fd07a, var(--accent));
      border-radius: 999px;
      transition: width 0.4s ease;
    }

    .score {
      font-size: 1.05rem;
      font-weight: bold;
      margin-top: 8px;
    }

    .message {
      min-height: 1.4em;
      margin: 10px 0 4px;
      font-size: 0.95rem;
      color: var(--accent);
      font-weight: bold;
    }

    .foods {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    button.food {
      flex: 1 1 130px;
      max-width: 160px;
      border: none;
      border-radius: 16px;
      padding: 14px 10px;
      font-size: 1rem;
      font-family: inherit;
      font-weight: bold;
      color: #fff;
      cursor: pointer;
      transition: transform 0.1s ease, box-shadow 0.15s ease, opacity 0.2s ease;
      box-shadow: 0 5px 0 rgba(0, 0, 0, 0.18);
    }

    button.food .emoji { display: block; font-size: 1.6rem; margin-bottom: 4px; }
    button.food .pts { display: block; font-size: 0.8rem; opacity: 0.9; font-weight: normal; }

    button.food:hover:not(:disabled) { transform: translateY(-2px); }
    button.food:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0, 0, 0, 0.18); }
    button.food:disabled { opacity: 0.5; cursor: not-allowed; }

    .food.grass { background: #5aa84b; }
    .food.soy { background: #c9a227; }
    .food.flowers { background: #d76ba3; }

    .reset {
      margin-top: 18px;
      border: none;
      border-radius: 16px;
      padding: 14px 28px;
      font-size: 1.05rem;
      font-family: inherit;
      font-weight: bold;
      color: #fff;
      background: #3d6fb4;
      cursor: pointer;
      box-shadow: 0 5px 0 rgba(0, 0, 0, 0.18);
      transition: transform 0.1s ease;
    }

    .reset:hover { transform: translateY(-2px); }
    .reset:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0, 0, 0, 0.18); }
    .reset[hidden] { display: none; }
  </style>
</head>
<body>
  <h1>Grow the Cow 🐄</h1>
  <p class="subtitle">Feed the cow to help it grow. Reach 30 points to fully grow it!</p>

  <div class="stage">
    <div class="cow-yard">
      <div class="cow-scene" id="cowScene" title="Drag to rotate">
        <div class="cow-cube" id="cowCube">
          <div class="face front cow-emoji">🐄</div>
          <div class="face back cow-emoji">🐄</div>
          <div class="face right skin"></div>
          <div class="face left skin"></div>
          <div class="face top skin"></div>
          <div class="face bottom skin"></div>
        </div>
      </div>
    </div>
    <p class="hint">🖱️ Drag the cow to spin it and inspect all sides.</p>

    <div class="progress-wrap">
      <div class="progress-bar" id="progressBar"></div>
    </div>
    <div class="score" id="score">Growth: 0 / 30 points</div>

    <p class="message" id="message">Pick a food to start feeding!</p>

    <div class="foods" id="foods">
      <button class="food grass" data-food="grass" data-points="3">
        <span class="emoji">🌿</span>
        Grass
        <span class="pts">+3 points</span>
      </button>
      <button class="food soy" data-food="soy" data-points="2">
        <span class="emoji">🫘</span>
        Soy
        <span class="pts">+2 points</span>
      </button>
      <button class="food flowers" data-food="flowers" data-points="1">
        <span class="emoji">🌸</span>
        Flowers
        <span class="pts">+1 point</span>
      </button>
    </div>

    <button class="reset" id="reset" hidden>Play again 🔄</button>
  </div>

  <script>
    (function () {
      "use strict";

      var MAX_POINTS = 30;
      var MIN_SCALE = 0.65;  // cube scale when empty
      var MAX_SCALE = 2.0;   // cube scale when fully grown

      var sceneEl = document.getElementById("cowScene");
      var cubeEl = document.getElementById("cowCube");
      var emojiFaces = Array.prototype.slice.call(
        cubeEl.querySelectorAll(".cow-emoji")
      );
      var scoreEl = document.getElementById("score");
      var barEl = document.getElementById("progressBar");
      var messageEl = document.getElementById("message");
      var foodsEl = document.getElementById("foods");
      var resetEl = document.getElementById("reset");
      var foodButtons = Array.prototype.slice.call(
        foodsEl.querySelectorAll("button.food")
      );

      var points = 0;

      // Rotation state (degrees), starting at a slight 3/4 angle so the
      // object reads as 3D right away.
      var rotX = -18;
      var rotY = 28;
      var growthScale = MIN_SCALE;

      var FOOD_LABELS = {
        grass: "grass 🌿",
        soy: "soy 🫘",
        flowers: "flowers 🌸"
      };

      function updateTransform() {
        cubeEl.style.transform =
          "rotateX(" + rotX + "deg) rotateY(" + rotY + "deg) " +
          "scale(" + growthScale + ")";
      }

      function render() {
        var clamped = Math.min(points, MAX_POINTS);
        var ratio = clamped / MAX_POINTS;

        // Grow the cow by scaling the whole 3D cube.
        growthScale = MIN_SCALE + (MAX_SCALE - MIN_SCALE) * ratio;
        updateTransform();

        // Progress bar + score text.
        barEl.style.width = (ratio * 100) + "%";
        scoreEl.textContent = "Growth: " + clamped + " / " + MAX_POINTS + " points";
      }

      function feed(food, foodPoints) {
        if (points >= MAX_POINTS) return;

        points += foodPoints;
        if (points > MAX_POINTS) points = MAX_POINTS;

        messageEl.textContent = "Yum! You fed " + FOOD_LABELS[food] +
          " (+" + foodPoints + ").";

        // Chew bounce on the scene (independent of the cube's rotation).
        sceneEl.classList.remove("happy");
        void sceneEl.offsetWidth; // restart animation
        sceneEl.classList.add("happy");

        render();

        if (points >= MAX_POINTS) finish();
      }

      function setCowEmoji(emoji) {
        emojiFaces.forEach(function (face) { face.textContent = emoji; });
      }

      function finish() {
        setCowEmoji("🐮");
        messageEl.textContent = "🎉 The cow is fully grown! Great job! " +
          "Drag it around to admire your work.";
        foodButtons.forEach(function (btn) { btn.disabled = true; });
        resetEl.hidden = false;
        resetEl.focus();
      }

      function reset() {
        points = 0;
        setCowEmoji("🐄");
        messageEl.textContent = "Pick a food to start feeding!";
        foodButtons.forEach(function (btn) { btn.disabled = false; });
        resetEl.hidden = true;
        render();
      }

      // --- Drag to rotate (mouse + touch via Pointer Events) ---
      var dragging = false;
      var lastX = 0;
      var lastY = 0;

      sceneEl.addEventListener("pointerdown", function (e) {
        dragging = true;
        lastX = e.clientX;
        lastY = e.clientY;
        sceneEl.classList.add("dragging");
        cubeEl.style.transition = "none"; // 1:1 responsiveness while dragging
        if (sceneEl.setPointerCapture) {
          try { sceneEl.setPointerCapture(e.pointerId); } catch (_) {}
        }
        e.preventDefault();
      });

      sceneEl.addEventListener("pointermove", function (e) {
        if (!dragging) return;
        var dx = e.clientX - lastX;
        var dy = e.clientY - lastY;
        lastX = e.clientX;
        lastY = e.clientY;

        rotY += dx * 0.6;
        rotX -= dy * 0.6;
        updateTransform();
      });

      function endDrag(e) {
        if (!dragging) return;
        dragging = false;
        sceneEl.classList.remove("dragging");
        cubeEl.style.transition = ""; // restore smoothing for growth
        if (sceneEl.releasePointerCapture && e.pointerId != null) {
          try { sceneEl.releasePointerCapture(e.pointerId); } catch (_) {}
        }
      }

      sceneEl.addEventListener("pointerup", endDrag);
      sceneEl.addEventListener("pointercancel", endDrag);

      foodButtons.forEach(function (btn) {
        btn.addEventListener("click", function () {
          feed(btn.getAttribute("data-food"),
               parseInt(btn.getAttribute("data-points"), 10));
        });
      });

      resetEl.addEventListener("click", reset);

      // Initial state.
      render();
    })();
  </script>
</body>
</html>
